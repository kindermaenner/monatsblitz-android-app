name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build-type:
        description: "Which version should be built?"
        required: true
        default: "Debug"
        type: choice
        options:
          - Release
          - Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: kindermaenner/ci-templates/.github/workflows/android-pipeline.yml@main
    secrets: inherit
    with:
      keystore-file: "monatsblitz-android-app-release.jks"
      build-type: ${{ inputs.build-type || 'Debug' }}
      run-instrumented-tests: true
      test-api-level: "34"
      run-sonar: true
      run-ftp-upload: ${{ github.ref == 'refs/heads/main' }}
      ftp-target-path: "kindermaenner.de/app-downloads/monatsblitz-android-app/"
      trigger-badges: ${{ github.ref == 'refs/heads/main' }}